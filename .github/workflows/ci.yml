name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.8", "3.9", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile all modules
        run: |
          python -m py_compile eval.py compare.py judge_eval.py env_loader.py client.py reporting.py
          python -m py_compile languages.py domain_benchmarks.py polyglot.py scripts/verify_polyglot_packs.py
          python -m py_compile suites.py judge.py ifeval.py scripts/fetch_benchmark_data.py
          python -m py_compile workload.py usecases.py report_md.py judge_validation.py scripts/*.py
          python -m py_compile benchmarks/*.py
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Smoke-test CLIs
        run: |
          python eval.py --help
          python compare.py --help
          python judge_eval.py --help
      - name: Smoke-test installed package
        run: |
          python -m pip install --no-deps .
          mkdir -p "$RUNNER_TEMP/llm-eval-package-smoke"
          cd "$RUNNER_TEMP/llm-eval-package-smoke"
          llm-eval --help > /dev/null
          llm-compare --help > /dev/null
          llm-judge --help > /dev/null
          python - <<'PY'
          import os
          import client, languages, polyglot, report_md, suites
          assert os.path.isfile(client.IMAGE_PATH)
          assert suites.load_items("coding", "multipl_e_python")[0]
          assert polyglot.has_pack("strict_typing", "typescript")
          assert languages._POLYGLOT_DIR == polyglot.FIXTURE_ROOT
          assert os.path.isfile(os.path.join(client.DATA_DIR, "reference", "published_scores.json"))
          assert client.DEFAULT_RESULTS_DIR == os.path.join(os.getcwd(), "results")
          assert not os.path.exists("results") and not os.path.exists("logs")
          PY
      - name: Smoke-test source distribution
        if: matrix.python-version == '3.11'
        run: |
          python -m pip install build "setuptools==61.0.0" wheel
          python -m build --no-isolation --outdir "$RUNNER_TEMP/llm-eval-sdist"
          python - <<'PY'
          import os
          from pathlib import Path
          from zipfile import ZipFile
          (wheel,) = Path(os.environ["RUNNER_TEMP"], "llm-eval-sdist").glob("*.whl")
          files = [path for path in Path("data").rglob("*") if path.is_file()]
          assert files
          with ZipFile(wheel) as package:
              for path in files:
                  name = "llm_eval_data/" + path.relative_to("data").as_posix()
                  assert package.read(name) == path.read_bytes(), name
              assert package.read("llm_eval_assets/invoice.png") == Path("assets/invoice.png").read_bytes()
          PY
          mkdir -p "$RUNNER_TEMP/llm-eval-sdist-tree"
          tar -xf "$RUNNER_TEMP"/llm-eval-sdist/*.tar.gz --strip-components=1 -C "$RUNNER_TEMP/llm-eval-sdist-tree"
          cd "$RUNNER_TEMP/llm-eval-sdist-tree"
          test -f config.json.example
          test -f scripts/fetch_benchmark_data.py
          test -f scripts/verify_polyglot_packs.py
          python -m unittest discover -s tests -v

  # Polyglot graders (Tests 20-25): build the image with every toolchain and
  # prove each test pack still tells known-good code from known-bad code.
  polyglot-packs:
    name: Polyglot test packs (Docker)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t llm-eval-suite:ci .
      - name: Self-check packs and run the full test suite with toolchains
        run: |
          docker run --rm --network none -v "$PWD:/app" --entrypoint python3 llm-eval-suite:ci scripts/verify_polyglot_packs.py
          docker run --rm --network none -v "$PWD:/app" --entrypoint python3 llm-eval-suite:ci -m unittest discover -s tests

  # Lint / type check. Non-blocking (continue-on-error) so pre-existing legacy
  # debt doesn't break the build; it surfaces new issues for developers.
  lint:
    name: Lint & type-check (non-blocking)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dev tooling
        run: python -m pip install --upgrade pip "ruff>=0.12.0" "mypy>=1.15.0,<1.17"
      - name: Ruff (lint)
        continue-on-error: true
        run: ruff check .
      - name: Mypy (type check)
        continue-on-error: true
        run: mypy
