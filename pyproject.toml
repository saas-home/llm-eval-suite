[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-eval-suite"
version = "1.0.0"
description = "Enterprise LLM server benchmark, stress testing, and cross-model efficiency comparison engine for any OpenAI-compatible API"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "Apache-2.0" }
authors = [
    { name = "llm-eval-suite contributors" }
]
keywords = [
    "llm",
    "benchmark",
    "evaluation",
    "openai",
    "vllm",
    "sglang",
    "ollama",
    "llama-cpp",
    "exllamav3",
    "efficiency",
    "stress-testing",
    "cruxeval",
    "swe-bench",
    "aime"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Testing",
]

[project.scripts]
llm-eval = "eval:main"
llm-compare = "compare:main"
llm-judge = "judge_eval:main"

# Dev-only tooling. The runtime stays zero-dependency (stdlib only); these are
# optional and never ship with the package.
[project.optional-dependencies]
dev = [
    "ruff>=0.12.0",
    "mypy>=1.14.0,<1.15; python_version < '3.9'",
    "mypy>=1.15.0,<1.17; python_version >= '3.9'",  # 1.17 dropped the Python 3.8 target
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
]

[tool.setuptools]
py-modules = [
    "client", "compare", "domain_benchmarks", "env_loader", "eval", "ifeval", "judge",
    "judge_eval", "judge_validation", "languages", "polyglot", "report_md", "reporting",
    "suites", "usecases", "workload",
]
packages = ["llm_eval_data", "llm_eval_assets"]

[tool.setuptools.package-dir]
llm_eval_data = "data"
llm_eval_assets = "assets"

[tool.setuptools.package-data]
llm_eval_data = ["*", "**/*"]
llm_eval_assets = ["*"]

# ---------------------------------------------------------------------------
# Lint / type / coverage config (dev-only; runtime is stdlib-only).
# The codebase is legacy and largely untyped, so these are configured
# permissively to catch new issues without blocking on pre-existing debt.
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 120
target-version = "py38"
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = [
    "E501",   # line too long -- legacy layout, enforced gradually
]

[tool.mypy]
python_version = "3.8"
files = ["eval.py", "compare.py", "judge_eval.py", "env_loader.py", "client.py", "reporting.py", "benchmarks"]
ignore_missing_imports = true
check_untyped_defs = false
warn_unused_ignores = false

[tool.coverage.run]
branch = true
source = ["."]
omit = ["tests/*", "benchmarks/*"]

[tool.coverage.report]
show_missing = true
